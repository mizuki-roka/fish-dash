<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>おさかな雑学ダッシュ</title>
<style>
  :root { --deep:#063a6b; --sea:#0a84b8; --ink:#10324f; --sun:#ffd23f; --coral:#ff6b5e; --mint:#2fc78f; --paper:#fffdf5; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; color-scheme:only light; }
  #probe { position:absolute; visibility:hidden; font-size:100px; line-height:1; white-space:nowrap; left:0; top:0; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--deep); touch-action:manipulation; overscroll-behavior:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif; color:var(--ink); -webkit-user-select:none; user-select:none; }
  #wrap { position:fixed; inset:0; overflow:hidden; }
  #stage { position:absolute; left:0; top:0; width:420px; height:740px; transform-origin:0 0; overflow:hidden; }
  canvas { position:absolute; inset:0; width:420px; height:740px; display:block; touch-action:none; }
  .overlay { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; padding:24px 20px; text-align:center; background:rgba(6,58,107,.86); color:#fff; }
  .overlay.show { display:flex; }
  #title { justify-content:center; gap:18px; }
  #title h1 { margin:0; font-size:calc(42px*var(--k,1)); line-height:1.2; color:var(--sun); letter-spacing:.04em; }
  #title p { margin:0; font-size:calc(18px*var(--k,1)); line-height:1.7; }
  button.main { border:0; border-radius:999px; background:var(--sun); color:var(--ink); font:inherit; font-size:calc(22px*var(--k,1)); font-weight:700; padding:14px 44px; cursor:pointer; box-shadow:0 5px 0 #c99a10; }
  button.main:active { transform:translateY(3px); box-shadow:0 2px 0 #c99a10; }
  #sound { position:absolute; right:8px; top:6px; z-index:5; width:64px; height:38px; white-space:nowrap; border:0; border-radius:10px; background:rgba(255,255,255,.22); color:#fff; font:inherit; font-size:calc(13px*var(--k,1)); font-weight:700; cursor:pointer; }
  #result h2 { margin:6px 0 2px; font-size:calc(32px*var(--k,1)); color:var(--sun); }
  #score { font-size:calc(20px*var(--k,1)); margin-bottom:10px; }
  #list { flex:1; min-height:0; width:100%; overflow-y:auto; touch-action:pan-y; text-align:left; -webkit-user-select:text; user-select:text; }
  .item { background:var(--paper); color:var(--ink); border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:calc(15px*var(--k,1)); line-height:1.5; }
  .item b { display:block; font-size:calc(16px*var(--k,1)); }
  .item .ok { color:#14865d; font-weight:700; } .item .ng { color:#d23f33; font-weight:700; }
  .item a { color:#0a6c9c; font-size:calc(13px*var(--k,1)); }
  .credit { font-size:calc(15px*var(--k,1)); line-height:1.9; margin-top:6px; flex:none; }
  .credit a { color:#ffe680; font-weight:700; }
  #result button.main { margin-top:12px; flex:none; }
</style>
</head>

const W = 420, H = 740, FISH_Y = 610, GATE_H = 92, LANE = { L:110, R:310 };
const SPEED = { fast:420, slow:59, picked:280, slowFromY:235 };
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d'), stage = document.getElementById('stage');
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let mode = 'title', game = null, gate = null, feedback = null, boss = null, bag = [];
let fishX = W/2, clock = 0, scroll = 0, floats = [], shots = [], scale = 1;

function fit() {
  const box = document.getElementById('wrap'), vv = window.visualViewport;
  const vw = Math.min(box.clientWidth, vv ? vv.width : box.clientWidth), vh = Math.min(box.clientHeight, vv ? vv.height : box.clientHeight);
  const pw = document.getElementById('probe').offsetWidth;
  document.documentElement.style.setProperty('--k', pw > 102 ? String(100/pw) : '1');
  scale = Math.min(vw/W, vh/H);
  stage.style.transform = `translate(${(vw-W*scale)/2}px,${(vh-H*scale)/2}px) scale(${scale})`;
  const dpr = Math.min(devicePixelRatio || 1, 3);
  canvas.width = Math.round(W*scale*dpr); canvas.height = Math.round(H*scale*dpr);
  ctx.setTransform(canvas.width/W, 0, 0, canvas.height/H, 0, 0);
}
addEventListener('resize', fit); addEventListener('orientationchange', ()=>setTimeout(fit,200)); addEventListener('load', fit);
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
fit(); setTimeout(fit,300);

/* 音 */
let audio = null, soundOn = true;
function beep(freq, dur, type='sine', delay=0, vol=.16) {
  if (!soundOn) return;
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === 'suspended') audio.resume();
  const t = audio.currentTime + delay, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t+dur);
}
const sfx = {
  ok(){ beep(660,.12,'triangle'); beep(880,.2,'triangle',.11); },
  ng(){ beep(220,.3,'sawtooth',0,.1); beep(165,.3,'sawtooth',.14,.1); },
  hit(){ beep(320+Math.random()*180,.07,'square',0,.05); },
  win(){ [523,659,784,1047].forEach((f,i)=>beep(f,.26,'triangle',i*.13)); },
  lose(){ [392,330,262].forEach((f,i)=>beep(f,.34,'sine',i*.2)); }
};

/* 進行 */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function nextQuestion(){ if(!bag.length) bag = shuffle(QUESTIONS.slice()); return bag.pop(); }
function show(id){ for (const o of document.querySelectorAll('.overlay')) o.classList.toggle('show', o.id===id); }

function startRun(){
  game = { power:CONFIG.startPower, answers:[] };
  floats = []; shots = []; boss = null; show(null); spawnGate();
}
function spawnGate(){
  const correctSide = Math.random()<.5 ? 'L' : 'R';
  gate = { y:60, q:nextQuestion(), correctSide, picked:null, resolved:false };
  mode = 'run';
}
function pick(side){
  if (mode==='run' && gate && !gate.resolved) gate.picked = side;
}
function resolveGate(){
  gate.resolved = true;
  const ok = gate.picked === gate.correctSide, delta = ok ? CONFIG.correct : -CONFIG.wrong;
  game.power += delta;
  game.answers.push({ q:gate.q, ok, skipped:!gate.picked });
  floats.push({ x:fishX, y:FISH_Y-50, text:(delta>0?'+':'')+delta, color:ok?'#fff27a':'#ffb3ab', t:0 });
  ok ? sfx.ok() : sfx.ng();
  feedback = { ok, t:0 }; mode = 'feedback';
}
function endFeedback(){
  feedback = null;
  if (game.power <= 0) return finish(false, 'パワーがなくなった…');
  if (game.answers.length >= CONFIG.questionsPerRun) { gate = null; boss = { t:0, hp:CONFIG.bossHp, shown:game.power, shotT:0, shake:0, done:false, img:Math.random()<.5?'bossA':'bossB' }; mode='boss'; return; }
  spawnGate();
}
function finish(won, heading){
  mode = 'result';
  won ? sfx.win() : sfx.lose();
  $('heading').textContent = heading;
  const n = game.answers.filter(a=>a.ok).length;
  $('score').textContent = `正解 ${n} ／ ${game.answers.length} 問`;
  const list = $('list'); list.textContent = '';
  for (const a of game.answers) {
    const d = document.createElement('div'); d.className='item';
    const b = document.createElement('b'); b.textContent = a.q.q; d.append(b);
    const r = document.createElement('div'); r.className = a.ok?'ok':'ng';
    r.textContent = (a.ok?'○ 正解：':'× 答え：') + a.q.a; d.append(r);
    const m = document.createElement('div'); m.textContent = a.q.note; d.append(m);
    const l = document.createElement('a'); l.href=a.q.url; l.target='_blank'; l.rel='noopener'; l.textContent='出典：'+a.q.src; d.append(l);
    list.append(d);
  }
  list.scrollTop = 0;
  show('result');
}

/* 入力 */
$('start').addEventListener('click', ()=>{ beep(660,.1,'triangle'); startRun(); });
$('again').addEventListener('click', ()=>{ beep(660,.1,'triangle'); startRun(); });
$('sound').addEventListener('pointerdown', e=>e.stopPropagation());
$('sound').addEventListener('click', e=>{ soundOn=!soundOn; e.currentTarget.textContent = soundOn?'音 ON':'音 OFF'; e.currentTarget.blur(); });
stage.addEventListener('pointerdown', e=>{
  if (mode==='run') { const r=stage.getBoundingClientRect(); pick((e.clientX-r.left)/r.width<.5?'L':'R'); }
  else if (mode==='feedback' && feedback.t>.35) endFeedback();
});
addEventListener('keydown', e=>{
  if (e.repeat) return;
  if (e.key==='ArrowLeft'||e.key==='a'||e.key==='A') { e.preventDefault(); pick('L'); }
  else if (e.key==='ArrowRight'||e.key==='d'||e.key==='D') { e.preventDefault(); pick('R'); }
  else if (e.key==='Enter') {
    if (mode==='title'||mode==='result') { e.preventDefault(); startRun(); }
    else if (mode==='feedback' && feedback.t>.35) endFeedback();
  }
  else if (mode==='feedback' && feedback.t>.35 && e.key===' ') endFeedback();
});

/* 描画の道具 */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function wrap(text,maxW){
  const lines=[]; let line='';
  for (const ch of text) { if (ctx.measureText(line+ch).width>maxW && line) { lines.push(line); line=ch; } else line+=ch; }
  if(line) lines.push(line); return lines;
}
function fitText(text,x,y,maxW,maxH,start,min,color,weight='700'){
  let size=start, lines;
  for(;;){ ctx.font=`${weight} ${size}px sans-serif`; lines=wrap(text,maxW); if(lines.length*size*1.3<=maxH||size<=min) break; size-=1; }
  ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle';
  const lh=size*1.3, top=y-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l,x,top+i*lh));
}
function drawBackground(dt,speed){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#2bb7dd'); g.addColorStop(.55,'#1088c4'); g.addColorStop(1,'#0a5a96');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  scroll=(scroll+speed*dt)%64;
  ctx.fillStyle='rgba(255,255,255,.22)';
  for(let y=-64+scroll;y<H;y+=64) ctx.fillRect(W/2-3,y,6,34);
  for(let i=0;i<9;i++){ const y=((i*90+scroll*1.4)%(H+90))-90; ctx.fillStyle='rgba(255,190,120,.55)';
    ctx.beginPath(); ctx.ellipse(i%2?4:W-4,y,16,34,0,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='rgba(255,255,255,.4)';
  for(const b of bubbles){ b.y+=(speed*.7*b.v+18)*dt; b.x+=reduced?0:Math.sin(clock*2+b.r)*.2; if(b.y>H+10){b.y=-10;b.x=Math.random()*W;}
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); }
}
function drawFish(x,y){
  const im=ART.hero; if(!im.complete) return;
  const h=140, w=h*im.naturalWidth/im.naturalHeight;
  ctx.save(); ctx.translate(x,y); ctx.rotate(reduced?0:Math.sin(clock*7)*.06);
  ctx.drawImage(im,-w/2,-h/2,w,h); ctx.restore();
}
function drawGate(g,feedbackOn){
  const y=g.y, sides={L:[18,'a'],R:[222,'b']};
  const texts = g.correctSide==='L' ? {L:g.q.a,R:g.q.b} : {L:g.q.b,R:g.q.a};
  for(const s of ['L','R']){
    const x=sides[s][0];
    let fill='#fffdf5', edge=g.picked===s?'#ffd23f':'#ff8fa3';
    if(feedbackOn) { fill = s===g.correctSide ? '#b9f3d9' : '#ffd0cb'; edge = s===g.correctSide ? '#2fc78f' : '#ff6b5e'; }
    ctx.lineWidth=g.picked===s?7:5; ctx.strokeStyle=edge; ctx.fillStyle=fill; rr(x,y,180,GATE_H,16); ctx.fill(); ctx.stroke();
    fitText(texts[s],x+90,y+GATE_H/2,158,GATE_H-16,24,13,'#10324f');
  }
}
function drawBoss(b){
  const enter=Math.min(1,b.t/.9), y=-180+400*enter, sx=b.shake>0?Math.sin(clock*90)*5:0, im=ART[b.img];
  if(im.complete){ const w=330, h=Math.min(330,w*im.naturalHeight/im.naturalWidth), dw=h*im.naturalWidth/im.naturalHeight; ctx.drawImage(im,W/2+sx-dw/2,y-h/2,dw,h); }
  const bw=340,bx=(W-bw)/2,by=56;
  ctx.fillStyle='rgba(0,0,0,.45)'; rr(bx,by,bw,24,12); ctx.fill();
  ctx.fillStyle='#ff6b5e'; rr(bx,by,Math.max(0,bw*b.hp/CONFIG.bossHp),24,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='700 16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('ごみオバケ',W/2,by+13);
}
function drawHud(){
  ctx.fillStyle='rgba(6,58,107,.9)'; ctx.fillRect(0,0,W,50);
  ctx.textBaseline='middle'; ctx.fillStyle='#ffd23f'; ctx.font='700 22px sans-serif'; ctx.textAlign='left';
  ctx.fillText('パワー '+Math.max(0,Math.round(boss?boss.shown:game.power)),14,26);
  if(!boss){ ctx.fillStyle='#fff'; ctx.font='700 20px sans-serif'; ctx.textAlign='center'; ctx.fillText(Math.min(game.answers.length+(mode==='run'?1:0),CONFIG.questionsPerRun)+' / '+CONFIG.questionsPerRun,W/2+50,26); }
}
function drawQuestion(){
  ctx.fillStyle='#fffdf5'; rr(10,56,400,102,14); ctx.fill();
  fitText(gate.q.q,W/2,107,372,90,23,14,'#10324f');
}
function drawFeedback(f){
  ctx.fillStyle='rgba(255,253,245,.97)'; rr(26,250,368,226,20); ctx.fill();
  fitText(f.ok?'正解！':'ざんねん…',W/2,292,340,50,36,20,f.ok?'#14865d':'#d23f33','800');
  fitText('答え：'+gate.q.a,W/2,342,340,40,23,15,'#10324f');
  fitText(gate.q.note,W/2,412,336,92,19,13,'#10324f','500');
}

/* 更新 */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; clock+=dt;
  let speed=90;
  if(mode==='run'){
    speed = gate.y<SPEED.slowFromY ? SPEED.fast : (gate.picked ? SPEED.picked : SPEED.slow);
    gate.y+=speed*dt;
    if(gate.y+GATE_H>=FISH_Y-18) resolveGate();
  } else if(mode==='feedback'){
    feedback.t+=dt; speed=40; gate.y+=speed*dt;
    if(feedback.t>=CONFIG.feedbackSec) endFeedback();
  } else if(mode==='boss'){
    speed=40; boss.t+=dt; boss.shake=Math.max(0,boss.shake-dt);
    const prog=Math.min(1,Math.max(0,(boss.t-.9)/CONFIG.bossAttackSec));
    if(boss.t>.9 && prog<1 && !boss.done){
      boss.hp=Math.max(0,CONFIG.bossHp-game.power*prog); boss.shown=game.power*(1-prog);
      boss.shotT-=dt; if(boss.shotT<=0){ boss.shotT=.11; shots.push({x:fishX,y:FISH_Y-40}); sfx.hit(); }
      if(boss.hp<=0) boss.done=true;
    }
    if((prog>=1||boss.done) && !boss.endT){ boss.hp = game.power>=CONFIG.bossHp?0:CONFIG.bossHp-game.power; boss.endT=boss.t; shots=[]; }
    if(boss.endT && boss.t-boss.endT>.7){ const won=game.power>=CONFIG.bossHp; finish(won, won?'ごみオバケをやっつけた！':'ごみオバケに逃げられた…'); }
  }
  const target = (mode==='run'&&gate.picked)?LANE[gate.picked] : (mode==='feedback'&&gate.picked)?LANE[gate.picked] : W/2;
  fishX+=(target-fishX)*Math.min(1,dt*12);

  drawBackground(dt,speed);
  if(game){
    if(boss) drawBoss(boss);
    if(gate) drawGate(gate,mode==='feedback');
    for(const s of shots){ s.y-=620*dt; if(s.y<300){ s.dead=true; if(boss) boss.shake=.08; continue; }
      ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(s.x,s.y,9,0,Math.PI*2); ctx.fill(); }
    shots=shots.filter(s=>!s.dead);
    drawFish(fishX,FISH_Y);
    drawHud();
    if(gate) drawQuestion();
    if(feedback) drawFeedback(feedback);
    for(const f of floats){ f.t+=dt; f.y-=70*dt; ctx.globalAlpha=Math.max(0,1-f.t/1.1); ctx.fillStyle=f.color; ctx.font='800 34px sans-serif'; ctx.textAlign='center'; ctx.fillText(f.text,f.x,f.y); ctx.globalAlpha=1; }
    floats=floats.filter(f=>f.t<1.1);
  } else drawFish(W/2,FISH_Y);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
